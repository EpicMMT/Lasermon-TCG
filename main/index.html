<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lasermon TCG</title>
    <!-- Richiama il file CSS -->
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>

    <!-- SCHERMATA: MAIN MENU -->
    <div id="main-menu" class="screen active">
        <div class="logo">LaserDuel TCG</div>
        <div class="menu-buttons">
            <button class="btn" onclick="showScreen('play-menu')">GIOCA</button>
            <button class="btn primary" onclick="showScreen('deck-list-menu')">DECKBUILDING</button>
            <!-- Pulsante Negozio disattivato come richiesto -->
            <button class="btn disabled">NEGOZIO</button>
        </div>
    </div>

    <!-- SCHERMATA: PLAY MENU -->
    <div id="play-menu" class="screen">
        <button class="btn back-btn" onclick="showScreen('main-menu')">INDIETRO</button>
        <h2 class="pixel-font" style="margin-bottom: 40px;">SELEZIONA MODALITÀ</h2>
        <div class="menu-buttons">
            <button class="btn">RICERCA PARTITA</button>
            <button class="btn">CREA LOBBY</button>
        </div>
    </div>

    <!-- SCHERMATA: LISTA DECK -->
    <div id="deck-list-menu" class="screen">
        <button class="btn back-btn" onclick="showScreen('main-menu')">INDIETRO</button>
        <h2 class="pixel-font">I TUOI DECK</h2>
        <div class="deck-list-container" id="deck-list-container">
            <!-- Renderizzato via JS -->
        </div>
    </div>

    <!-- SCHERMATA: DECK EDITOR (30 SLOT) -->
    <div id="deck-editor-menu" class="screen">
        <button class="btn back-btn" onclick="showScreen('deck-list-menu')">INDIETRO</button>
            <div style="display: flex; gap: 15px; align-items: center; justify-content: center; margin-bottom: 20px;">
            <!-- Input per rinominare il mazzo -->
            <input type="text" id="deck-name-input" onchange="updateDeckName(this.value)" placeholder="Nome Mazzo..." style="font-size: 1.5rem; font-weight: bold; padding: 5px; border-radius: 5px; text-align: center;">
            
            <!-- Pulsante per scegliere l'immagine -->
            <button onclick="openCoverSelector()" style="padding: 10px; font-size: 1rem; cursor: pointer; border-radius: 5px; border: none; background: #ffcc00; font-weight: bold;">
                🖼️ Scegli Copertina
            </button>

            <button onclick="showScreen('deck-list-menu')" style="padding: 10px; font-size: 1rem; cursor: pointer;">Salva e Torna ai Mazzi</button>
        </div>
        
        <!-- Personaggi (6 slot) -->
        <div class="deck-section">
            <h3>CARTE PERSONAGGIO (6)</h3>
            <div class="cards-grid" id="grid-character"></div>
        </div>

        <!-- Evoluzioni (2 slot) -->
        <div class="deck-section">
            <h3>CARTE EVOLUZIONE (2)</h3>
            <div class="cards-grid" id="grid-evolution"></div>
        </div>

        <!-- Aiuto/Stadio (10 slot) -->
        <div class="deck-section">
            <h3>CARTE TRAINER: AIUTO/STADIO (10)</h3>
            <div class="cards-grid" id="grid-trainer-hs"></div>
        </div>

        <!-- Strumento (12 slot) -->
        <div class="deck-section">
            <h3>CARTE TRAINER: STRUMENTO (12)</h3>
            <div class="cards-grid" id="grid-trainer-item"></div>
        </div>
    </div>

    <!-- MODALE: SELEZIONE CARTE -->
    <div id="card-selector-modal">
        <h2 class="pixel-font" style="color: white; margin-top: 0;">SELEZIONA CARTA</h2>
        <div class="modal-content">
            <div class="modal-grid" id="modal-card-list">
                <!-- Carte disponibili caricate via JS -->
            </div>
        </div>
        <button class="btn primary close-modal" onclick="closeModal()">ANNULLA</button>
    </div>

    <script src="../script/cardsDB.js"></script>
    <script src="../script/deckBuilding.js"></script>
    <script src="../script/navigation.js"></script>
</body>
</html>
